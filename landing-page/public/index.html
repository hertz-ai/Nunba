    <!-- Inline critical splash styles — renders BEFORE any external CSS loads -->
    <style>
      /* Loader matches the hero's base look: black bg + drifting brand
         particles.  When React mounts and the hero renders, the only
         visible change is the hero content fading in — the background
         field is already there, so there's no jarring cut from
         "logo+spinner on flat bg" to "particle hero". */
      #pre-react-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: black;
        overflow: hidden;
      }
      #pre-react-loader.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .pre-loader-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      .pre-loader-particles span {
        position: absolute;
        border-radius: 50%;
        animation: particleFloat 18s ease-in-out infinite;
      }
      @keyframes particleFloat {
        0%, 100% { transform: translateY(0) scale(1); }
        33% { transform: translateY(-8px) scale(1.15); }
        66% { transform: translateY(4px) scale(0.9); }
      }
      #pre-react-loader > img,
      #pre-react-loader > .loader-spinner,
      #pre-react-loader > .loader-timeout {
        position: relative;
        z-index: 1;
      }
      @keyframes nunba-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Timeout fallback — shows retry message if React never mounts within 12s */
      #pre-react-loader .loader-timeout {
        display: none;
        text-align: center;
        animation: nunba-fade-in 0.4s ease both;
      }
      #pre-react-loader.stalled .loader-timeout {
        display: block;
      }
      #pre-react-loader.stalled .loader-spinner {
        display: none;
      }
      @keyframes nunba-fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .loader-retry-btn {
        background: linear-gradient(135deg, #6c63ff, #9b94ff);
        color: #fff;
        border: none;
        padding: 10px 28px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 12px;
        transition: opacity 0.2s;
      }
      .loader-retry-btn:hover {
        opacity: 0.85;
      }
      .loader-status {
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
        margin-top: 8px;
        font-family: system-ui, sans-serif;
      }
      /* ── Always-present window controls (frameless pywebview shell) ──
         The real custom titlebar lives INSIDE the React SPA (NunbaTitleBar).
         If the SPA never mounts (slow/failed boot, chunk error, the
         "Taking longer than expected" state) a frameless window would have
         NO way to close / move / minimize — a trapped window.  This static
         titlebar guarantees the 3 controls + drag from the very first paint,
         and is removed once React's NunbaTitleBar takes over.  Revealed by
         JS only inside pywebview on Win/Linux (macOS keeps native traffic
         lights; a browser tab needs no chrome). */
      #pre-react-titlebar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 32px;
        z-index: 10001; /* above the splash loader (9999) so it's clickable */
        display: none;
        align-items: center;
        justify-content: flex-end;
        background: #0f0e17;
        -webkit-app-region: drag;
        app-region: drag;
        user-select: none;
        -webkit-user-select: none;
      }
      #pre-react-titlebar .ptb-title {
        position: absolute; left: 12px; top: 0; height: 32px;
        display: flex; align-items: center; gap: 6px;
        font: 600 11px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #cfcaff; letter-spacing: 0.3px;
      }
      #pre-react-titlebar .ptb-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: linear-gradient(135deg, #6c63ff, #ff6b6b);
      }
      #pre-react-titlebar button {
        -webkit-app-region: no-drag; app-region: no-drag;
        width: 46px; height: 32px; border: none; background: transparent;
        color: #cfcaff; cursor: pointer; display: flex;
        align-items: center; justify-content: center; padding: 0; outline: none;
        transition: background 0.12s ease;
      }
      #pre-react-titlebar button:hover { background: rgba(255, 255, 255, 0.08); }
      #pre-react-titlebar button.ptb-close:hover { background: #e94560; }
    </style>

    <!-- Titlebar content-offset (frameless pywebview shell).  Mirrors the
         rules NunbaTitleBar.js injects, but lives HERE so the 32px reservation
         applies from FIRST PAINT — independent of whether React mounts (the
         "Main window failed to start" / slow-boot case).  Gated on
         html.nunba-frameless-active, set by the reveal script below (before
         React) and toggled per-route by React's NunbaTitleBar (which REMOVES
         it on titlebar-less routes like /voice-orb).  Inert in browser/macOS
         mode (class never set there).  NunbaTitleBar's own injection guard
         checks for #nunba-titlebar-offsets and SKIPS when this block is
         present → single runtime source, no double-offset; its copy remains a
         fallback (e.g. under Jest, where index.html isn't loaded). -->
    <style id="nunba-titlebar-offsets">
      html.nunba-frameless-active {
        padding-top: var(--nunba-titlebar-h, 32px);
        height: 100vh;
        box-sizing: border-box;
        /* overflow-y MUST NOT be 'hidden' here.  The root element's overflow
           PROPAGATES TO THE VIEWPORT (CSS Overflow 3.3), so 'overflow: hidden'
           on <html> does not merely clip <html> — it disables document
           scrolling entirely.  With it set, /admin/*, /social/* and every other
           long page became unscrollable INSIDE Nunba while scrolling fine in a
           browser (where this class is never applied).  The mouse wheel did
           nothing; a missing scrollbar was the harmless symptom, the dead wheel
           was the bug.  Keep overflow-x hidden (we never want a horizontal
           bar) and overflow-y auto so the document can scroll.
           NOTE: no backticks in this block — the mirrored copy in
           NunbaTitleBar.js lives inside a JS template literal. */
        overflow-x: hidden;
        overflow-y: auto;
      }
      /* Routes that own their own viewport (the chat orb and the agents
         canvas) must NOT document-scroll — they lay out to exactly the
         window and scroll internally.  React's NunbaTitleBar toggles
         .nunba-fixed-viewport per-route; only those routes get the clamp. */
      html.nunba-frameless-active.nunba-fixed-viewport {
        overflow: hidden;
      }
      html.nunba-frameless-active body { height: 100%; margin: 0; }
      html.nunba-frameless-active .h-screen,
      html.nunba-frameless-active .min-h-screen {
        height: calc(100vh - var(--nunba-titlebar-h, 32px)) !important;
        min-height: calc(100vh - var(--nunba-titlebar-h, 32px)) !important;
      }
      html.nunba-frameless-active #root {
        min-height: calc(100vh - var(--nunba-titlebar-h, 32px)) !important;
      }
      html.nunba-frameless-active main { padding-top: 0 !important; }
      html.nunba-frameless-active .fixed.top-0 { top: var(--nunba-titlebar-h, 32px); }
      html.nunba-frameless-active .MuiAppBar-positionFixed { top: var(--nunba-titlebar-h, 32px); }
      html.nunba-frameless-active .MuiDrawer-paperAnchorLeft,
      html.nunba-frameless-active .MuiDrawer-paperAnchorRight,
      html.nunba-frameless-active .MuiDrawer-paperAnchorTop {
        top: var(--nunba-titlebar-h, 32px);
        height: calc(100vh - var(--nunba-titlebar-h, 32px));
      }
    </style>

    <!-- Early error capture — catches module/chunk failures BEFORE React loads -->
    <script>
      window.__earlyErrors = [];
      window.addEventListener('error', function(e) {
        window.__earlyErrors.push({
          msg: e.message || String(e),
          src: e.filename || '',
          line: e.lineno || 0,
          col: e.colno || 0,
          ts: Date.now()
        });
      });
      window.addEventListener('unhandledrejection', function(e) {
        window.__earlyErrors.push({
          msg: 'UnhandledRejection: ' + (e.reason ? (e.reason.message || String(e.reason)) : 'unknown'),
          ts: Date.now()
        });
      });
    </script>

        <span style="left:79%;top:90%;width:3px;height:3px;background:#6C63FF;opacity:.18;animation-duration:16s;animation-delay:-14s"></span>
        <span style="left:91%;top:96%;width:2px;height:2px;background:#FF6B6B;opacity:.12;animation-duration:23s;animation-delay:-3s"></span>
      </div>
      <img
        src="./HevolveLogo.png"
        alt="Nunba"
        style="width: 64px; height: 64px; border-radius: 16px; opacity: 0.9"
      />
      <div
        class="loader-spinner"
        style="
          width: 36px;
          height: 36px;
          border: 3px solid rgba(108, 99, 255, 0.2);
          border-top-color: #6c63ff;
          border-radius: 50%;
          animation: nunba-spin 0.8s linear infinite;
        "
      ></div>
      <div class="loader-timeout">
        <div
          style="
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            font-family: system-ui, sans-serif;
            font-weight: 500;
          "
        >
          Taking longer than expected
        </div>
        <button class="loader-retry-btn" onclick="location.reload()">
          Reload
        </button>
        <div class="loader-status" id="loader-status-text">
          Waiting for server...
        </div>
      </div>
    </div>

    <div style="background: black; min-height: 100vh" id="root"></div>

    <script>
      // Hide splash once React ACTUALLY mounts (not just a <style> tag)
      var _reactMounted = false;
      var _mo = new MutationObserver(function () {
        var r = document.getElementById('root');
        if (!r) return;
        // Check for real React content — skip <style>, <script>, <noscript> tags
        var hasContent = false;
        for (var i = 0; i < r.children.length; i++) {
          var tag = r.children[i].tagName;
          if (tag !== 'STYLE' && tag !== 'SCRIPT' && tag !== 'NOSCRIPT') {
            // Must have meaningful innerHTML (not just an empty div)
            if (r.children[i].innerHTML.length > 50) {
              hasContent = true;
              break;
            }
          }
        }
        if (hasContent) {
          _reactMounted = true;
          var s = document.getElementById('pre-react-loader');
          if (s) {
            s.classList.add('hidden');
            setTimeout(function () {
              s.remove();
            }, 350);
          }
          // React's NunbaTitleBar now owns the window chrome — drop the
          // static fallback titlebar so the two don't stack.
          var tb = document.getElementById('pre-react-titlebar');
          if (tb) tb.remove();
          _mo.disconnect();
        }
      });
      _mo.observe(document.getElementById('root'), {childList: true, subtree: true});

      // Timeout: if React hasn't mounted in 12s, show retry UI
      setTimeout(function () {
        if (_reactMounted) return;
        var loader = document.getElementById('pre-react-loader');
        if (loader) {
          loader.classList.add('stalled');
          // Check if server is reachable
          fetch('/cors/test', {method: 'GET'})
            .then(function (r) {
              if (r.ok) {
                var st = document.getElementById('loader-status-text');
                if (st)
                  st.textContent =
                    'Server is running. App may have encountered an error.';
              }
            })
            .catch(function () {
              var st = document.getElementById('loader-status-text');
              if (st)
                st.textContent = 'Server is starting up... Reload to retry.';
            });
        }
      }, 12000);
    </script>

    <!-- Wire the always-present window controls to pywebview's window API and
         reveal them only inside a frameless pywebview window on Win/Linux.
         This is the lifeline when the SPA (and its NunbaTitleBar) never mounts. -->
    <script>
      (function () {
        var bar = document.getElementById('pre-react-titlebar');
        if (!bar) return;
        var isMac = /Mac|iPhone|iPad|iPod/i.test(
          navigator.platform || navigator.userAgent || ''
        );
        function callWin(name) {
          try {
            var api = window.pywebview && window.pywebview.api;
            if (api && typeof api[name] === 'function') api[name]();
          } catch (e) {}
        }
        var b;
        if ((b = bar.querySelector('.ptb-min')))
          b.addEventListener('click', function () { callWin('window_minimize'); });
        if ((b = bar.querySelector('.ptb-max')))
          b.addEventListener('click', function () { callWin('window_toggle_maximize'); });
        if ((b = bar.querySelector('.ptb-close')))
          b.addEventListener('click', function () { callWin('window_close'); });
        function reveal() {
          if (isMac) return;
          if (window.pywebview && window.pywebview.api) {
            bar.style.display = 'flex';
            // Reserve the 32px titlebar strip at the DOCUMENT level NOW —
            // before React mounts — so page content + MUI AppBars/Drawers never
            // sit under the bar even if the SPA boots slowly or never mounts.
            // React's NunbaTitleBar later toggles this same class per-route and
            // REMOVES it on titlebar-less routes (e.g. /voice-orb), so the
            // global default-on here is corrected for those exceptions.
            document.documentElement.style.setProperty('--nunba-titlebar-h', '32px');
            document.documentElement.classList.add('nunba-frameless-active');
          }
        }
        reveal();
        window.addEventListener('pywebviewready', reveal);
        // pywebview's api object can attach a beat after the event on some
        // backends — re-check briefly until it shows (or give up after ~10s).
        var tries = 0;
        var iv = setInterval(function () {
          reveal();
          if (++tries > 20 || bar.style.display === 'flex') clearInterval(iv);
        }, 500);
      })();
    </script>
  </body>
</html>
